<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <title>Минёр-помощник</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: "Comfortaa", sans-serif;
            text-align: center;
            background: #0f324e;
            margin: 0;
            padding: 20px;
            color: #fff;
        }

        h2 {
            margin: 5px;
        }

        #board {
            display: inline-block;
            margin-top: 10px;
            padding: 5px;
            border: 0.125rem solid rgba(191, 213, 255, 0.75);
            border-radius: 0.75rem;
        }

        .row {
            display: flex;
        }

        .cell {
            margin: 3px;
            width: 56px;
            height: 32px;
            line-height: 32px;
            border: 1px solid #a4c9ff;
            border-radius: 4px;
            background: rgba(164, 201, 255, 0.45);
            cursor: pointer;
            user-select: none;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            vertical-align: middle;
            box-shadow: inset 0 2px 10px 0 rgba(164, 201, 255, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cell.number-0 {
            background: transparent;
            color: transparent;
        }

        .cell.number-1 {
            color: #ffffff;
        }

        .cell.number-2 {
            color: #ffff00;
        }

        .cell.number-3 {
            color: #00ff00;
        }

        .cell.number-4 {
            color: #ae00ff;
        }

        .cell.number-5 {
            color: #ff55ff;
        }

        .cell.number-6 {
            color: #ffaa00;
        }

        .cell.number-7 {
            color: #55fff9;
        }

        .cell.number-8 {
            color: #b86dff;
        }

        .cell.unknown {
            opacity: 0.6;
        }

        .cell.percent {
            font-size: 12px;
        }

        .cell.safe {
            background: rgba(0, 255, 0, 0.5);
            border: 1px solid #a4ffa9;
            box-shadow: inset 0 2px 10px 0 rgba(173, 255, 164, 0.75);
        }

        .cell.danger {
            background:#ffbc51;
        }

        .cell.mine {
            background: rgba(255, 0, 0, 0.5);
            border: 1px solid #ffa4a4;
            box-shadow: inset 0 2px 10px 0 rgba(255, 164, 164, 0.75);
        }

        .cell.mine img {
            max-width: 60%;
            max-height: 60%;
            display: block;
            margin: auto;
        }

        .controls {
            margin: 10px;
        }

        select {
            padding: 6px 10px;
            font-size: 14px;
            border-radius: 4px;
        }

        button {
            padding: 6px 12px;
            margin-left: 6px;
            border-radius: 4px;
            cursor: pointer;
        }

        #info {
            height: 24px;
            margin-top: 8px;
            font-size: 15px;
            color: #ff6666;
        }

        #cellLegend {
            display: inline-block;
            text-align: left;
            margin-top: 15px;
            border: 0.125rem solid rgba(191, 213, 255, 0.75);
            padding: 10px;
            border-radius: 0.75rem;
        }

        #cellLegend .row {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        #cellLegend .row .cell {
            margin-right: 10px;
        }
    </style>
</head>

<body>
    <h2>Минёр-помощник</h2>
    <div class="controls">
        Уровень:
        <select id="levelSelect">
            <option value="1">1) Васп (7×7)</option>
            <option value="2">2) Хорнет (8×8)</option>
            <option value="3">3) Викинг (9×9)</option>
            <option value="4">4) Титан (10×10)</option>
            <option value="5">5) Мамонт (11×11)</option>
        </select>
        <button id="resetBtn">Сброс</button>
    </div>
    <div id="board"></div>
    <div id="info"></div>
    <div id="cellLegend">
        <div class="row">
            <div class="cell number-0"></div>
            Пустая клетка (рядом нет мин)
        </div>
        <div class="row">
            <div class="cell">X</div>
            Рядом X мин
        </div>
        <div class="row">
            <div class="cell unknown"></div>
            Не открытая клетка
        </div>
        <div class="row">
            <div class="cell unknown safe"></div>
            Точно нет мины
        </div>
        <div class="row">
            <div class="cell unknown mine"></div>
            Точно есть мина
        </div>
        <div class="row">
            <div class="cell unknown danger"></div>
            Нельзя сказать точно есть ли мина, но тут шанс на неё не попасть больше
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
